<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="manifest" href="/PACT/manifest.json">
  <link rel="icon" type="image/png" href="assets/icons/PACT_favicon.png">
  <link rel="apple-touch-icon" href="/PACT/icons/apple-touch-icon.png">
  <title>PACT — Sign in</title>
  <style>
    body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; margin: 0;
           background:#0f172a; color:#e2e8f0; }
    .wrap { max-width: 380px; margin: 0 auto; padding: 3rem 1.25rem; }
    h1 { font-size: 1.4rem; margin: 0 0 .25rem; }
    p.sub { color:#94a3b8; margin:0 0 1.5rem; font-size:.9rem; }
    .tabs { display:flex; gap:.5rem; margin-bottom:1.25rem; }
    .tabs button { flex:1; background:#1e293b; color:#94a3b8; border:1px solid #334155;
                   border-radius:.5rem; padding:.5rem; cursor:pointer; font-size:.9rem; }
    .tabs button.active { color:#0f172a; background:#38bdf8; border-color:#38bdf8; font-weight:600; }
    label { display:block; font-size:.8rem; color:#94a3b8; margin:.75rem 0 .25rem; }
    input { width:100%; box-sizing:border-box; background:#1e293b; color:#e2e8f0;
            border:1px solid #334155; border-radius:.5rem; padding:.6rem .7rem; font-size:1rem; }
    input:focus { outline:none; border-color:#38bdf8; }
    .primary { width:100%; margin-top:1.25rem; background:#38bdf8; color:#0f172a; border:none;
               border-radius:.5rem; padding:.7rem; font-size:1rem; font-weight:600; cursor:pointer; }
    .primary:disabled { opacity:.5; cursor:default; }
    .link { background:none; border:none; color:#38bdf8; cursor:pointer; font-size:.85rem;
            padding:0; margin-top:1rem; }
    .msg { margin-top:1rem; font-size:.85rem; min-height:1.2em; }
    .msg.err { color:#f87171; }
    .msg.ok  { color:#4ade80; }
    .hidden { display:none; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>PACT</h1>
    <p class="sub">Sign in to save characters to the cloud.</p>

    <!-- Signed-out: login / register -->
    <div id="authView">
      <div class="tabs">
        <button id="tabLogin" class="active">Sign in</button>
        <button id="tabRegister">Register</button>
      </div>

      <form id="authForm" autocomplete="on">
        <div id="nameRow" class="hidden">
          <label for="displayName">Display name</label>
          <input id="displayName" type="text" autocomplete="name" placeholder="What your DM sees">
        </div>
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="email" required>
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password" required minlength="6">
        <button id="submitBtn" class="primary" type="submit">Sign in</button>
      </form>

      <button id="forgotBtn" class="link">Forgot password?</button>
      <div id="msg" class="msg"></div>
    </div>

    <!-- Recovery: arrived via a password-reset email link (Supabase's PASSWORD_RECOVERY redirect).
         See the sync inline script below (sets window.__pactAuthRedirect before this module runs)
         and the boot logic at the bottom of the module script. -->
    <div id="recoveryView" class="hidden">
      <div id="recoveryChecking">
        <p class="sub">Verifying your reset link…</p>
      </div>

      <div id="recoveryForm" class="hidden">
        <p class="sub">Choose a new password for your account.</p>
        <form id="newPasswordForm" autocomplete="on">
          <label for="newPassword">New password</label>
          <input id="newPassword" type="password" autocomplete="new-password" required minlength="6">
          <label for="newPassword2">Confirm new password</label>
          <input id="newPassword2" type="password" autocomplete="new-password" required minlength="6">
          <button id="newPasswordBtn" class="primary" type="submit">Set new password</button>
        </form>
        <div id="recoveryMsg" class="msg"></div>
      </div>

      <div id="recoveryExpired" class="hidden">
        <p class="sub">This reset link is invalid or has expired.</p>
        <label for="resendEmail">Email</label>
        <input id="resendEmail" type="email" autocomplete="email">
        <button id="resendBtn" class="primary" type="button">Send a new reset email</button>
        <div id="resendMsg" class="msg"></div>
      </div>
    </div>

  </div>

  <script>
    // Runs BEFORE the module script below (classic scripts execute in document order before a
    // deferred `type=module` script does), so this can never race the Supabase client's own
    // async hash-clearing during _initialize() -- by the time our module imports supabase-client.js
    // and that client starts consuming the URL, we've already captured what we need synchronously.
    // Recovery links land here as `#access_token=...&type=recovery&...`; an invalid/expired/
    // already-used token instead lands as `#error=...&error_code=...&error_description=...`
    // (Supabase's own /auth/v1/verify redirect distinguishes these before we ever see the URL).
    (function () {
      var hash = location.hash || '';
      var isRecovery = /(?:^|[&#])type=recovery(?:&|$)/.test(hash);
      var hasError = /(?:^|[&#])error=/.test(hash);
      var desc = null;
      if (hasError) {
        var m = /[&#]error_description=([^&]*)/.exec(hash);
        if (m) { try { desc = decodeURIComponent(m[1].replace(/\+/g, ' ')); } catch (e) { desc = null; } }
      }
      window.__pactAuthRedirect = { recovery: isRecovery, error: hasError, errorDescription: desc };
    })();
  </script>
  <script type="module">
    import {
      register, login, forgotPassword, updatePassword,
      currentUser, onAuthChange
    } from './js/auth.js';
    import { PENDING_INVITE_KEY } from './js/campaign.js';

    const $ = id => document.getElementById(id);
    let mode = 'login';   // 'login' | 'register'

    // Campaign join/invite UI, Deliverable 1 -- Path A (docs/plans/2026-07-11-campaign-join-
    // invite-flow.md): CharGen stashes a pending ?invite=<token> into sessionStorage (under
    // PENDING_INVITE_KEY, shared via js/campaign.js) before sending an unauthenticated player
    // here to sign in. On a successful sign-in, resume the trip back to CharGen with it rather
    // than showing the generic signed-in view. Doesn't cover the registration email-confirm
    // redirect landing in a NEW tab (sessionStorage is per-tab) -- accepted limitation, see the
    // plan's risk notes.
    function resumePendingInvite() {
      let token; try { token = sessionStorage.getItem(PENDING_INVITE_KEY); } catch { token = null; }
      if (!token) return false;
      location.href = 'tools/PACT-CharGen-Webtool.html?invite=' + encodeURIComponent(token);
      return true;
    }

    function setMode(m) {
      mode = m;
      $('tabLogin').classList.toggle('active', m === 'login');
      $('tabRegister').classList.toggle('active', m === 'register');
      $('nameRow').classList.toggle('hidden', m !== 'register');
      $('submitBtn').textContent = m === 'login' ? 'Sign in' : 'Create account';
      $('password').autocomplete = m === 'login' ? 'current-password' : 'new-password';
      msg('');
    }
    function msg(text, kind) { const el = $('msg'); el.textContent = text; el.className = 'msg ' + (kind || ''); }

    // Recovery-view state — see the sync inline script above for how a visit is classified.
    function showRecoveryChecking() {
      $('authView').classList.add('hidden');
      $('recoveryView').classList.remove('hidden');
      $('recoveryChecking').classList.remove('hidden');
      $('recoveryForm').classList.add('hidden');
      $('recoveryExpired').classList.add('hidden');
    }
    function showRecoveryForm() {
      $('recoveryChecking').classList.add('hidden');
      $('recoveryForm').classList.remove('hidden');
      $('recoveryExpired').classList.add('hidden');
    }
    function showRecoveryExpired(detail) {
      $('authView').classList.add('hidden');
      $('recoveryView').classList.remove('hidden');
      $('recoveryChecking').classList.add('hidden');
      $('recoveryForm').classList.add('hidden');
      $('recoveryExpired').classList.remove('hidden');
      if (detail) { const el = $('resendMsg'); el.textContent = detail; el.className = 'msg err'; }
    }

    // A signed-in visitor has nothing to do on this page — index.html's own header already shows
    // "Signed in as X · Log out" (see index.html's authBtn wiring). Send them straight there instead of
    // showing a redundant "you're signed in" panel with its own duplicate tool links / log-out button.
    function goToIndex() { location.href = 'index.html'; }

    $('tabLogin').onclick = () => setMode('login');
    $('tabRegister').onclick = () => setMode('register');

    $('authForm').onsubmit = async (e) => {
      e.preventDefault();
      $('submitBtn').disabled = true;
      msg('Working…');
      try {
        const email = $('email').value.trim();
        const password = $('password').value;
        if (mode === 'register') {
          await register(email, password, $('displayName').value.trim());
          // If email confirmation is OFF, a session exists immediately.
          if (await currentUser()) { if (!resumePendingInvite()) goToIndex(); }
          else { msg('Account created — check your email to confirm, then sign in.', 'ok'); setMode('login'); }
        } else {
          await login(email, password);
          // Only resume a pending invite right after THIS sign-in submission, not on every
          // later boot-time "already signed in" check below -- otherwise a stale token left
          // over from a declined/failed invite (see js/campaign.js PENDING_INVITE_KEY) would
          // hijack any unrelated future visit to this page in the same tab.
          if (!resumePendingInvite()) goToIndex();
        }
      } catch (err) {
        msg(err.message || String(err), 'err');
      } finally {
        $('submitBtn').disabled = false;
      }
    };

    $('forgotBtn').onclick = async () => {
      const email = $('email').value.trim();
      if (!email) { msg('Enter your email above first, then click Forgot password.', 'err'); return; }
      try { await forgotPassword(email); msg('Reset email sent to ' + email + '.', 'ok'); }
      catch (err) { msg(err.message || String(err), 'err'); }
    };

    function recoveryMsg(text, kind) {
      const el = $('recoveryMsg'); el.textContent = text; el.className = 'msg ' + (kind || '');
    }
    $('newPasswordForm').onsubmit = async (e) => {
      e.preventDefault();
      const p1 = $('newPassword').value, p2 = $('newPassword2').value;
      if (p1 !== p2) { recoveryMsg('Passwords do not match.', 'err'); return; }
      $('newPasswordBtn').disabled = true;
      recoveryMsg('Working…');
      try {
        await updatePassword(p1);
        recoveryMsg('Password updated — signing you in…', 'ok');
        setTimeout(goToIndex, 900);
      } catch (err) {
        recoveryMsg(err.message || String(err), 'err');
      } finally {
        $('newPasswordBtn').disabled = false;
      }
    };

    $('resendBtn').onclick = async () => {
      const email = $('resendEmail').value.trim();
      const el = $('resendMsg');
      const setResendMsg = (t, k) => { el.textContent = t; el.className = 'msg ' + (k || ''); };
      if (!email) { setResendMsg('Enter your email above first.', 'err'); return; }
      try { await forgotPassword(email); setResendMsg('Reset email sent to ' + email + '.', 'ok'); }
      catch (err) { setResendMsg(err.message || String(err), 'err'); }
    };

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/PACT/service-worker.js').then(function (reg) {
        reg.update();
        reg.addEventListener('updatefound', function () {
          var sw = reg.installing;
          sw.addEventListener('statechange', function () {
            if (sw.state === 'installed' && navigator.serviceWorker.controller) {
              var bar = document.createElement('div');
              bar.style.cssText = 'position:fixed;bottom:0;left:0;right:0;background:#1e293b;border-top:1px solid #38bdf8;padding:.75rem 1.25rem;display:flex;justify-content:space-between;align-items:center;font-size:.9rem;z-index:999';
              bar.innerHTML = '<span>A new version of PACT is ready.</span><button style="background:#38bdf8;color:#0f172a;border:none;padding:.35rem .9rem;border-radius:.4rem;cursor:pointer;font-weight:600">Reload</button>';
              bar.querySelector('button').onclick = function () { sw.postMessage('skipWaiting'); location.reload(); };
              document.body.appendChild(bar);
            }
          });
        });
        document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') reg.update(); });
        window.addEventListener('focus', function () { reg.update(); });
      });
    }

    // Recovery/error redirect takes priority over the normal "already signed in" bounce below —
    // Supabase's own PASSWORD_RECOVERY flow establishes a real session as part of the redirect, so
    // currentUser() would resolve truthy for a genuine recovery visit too; without this branch that
    // bounce would fire first and the user would never see the new-password form.
    const authRedirect = window.__pactAuthRedirect || { recovery: false, error: false, errorDescription: null };
    if (authRedirect.error) {
      showRecoveryExpired(authRedirect.errorDescription);
    } else if (authRedirect.recovery) {
      showRecoveryChecking();
      let resolved = false;
      const unsub = onAuthChange((event) => {
        if (event === 'PASSWORD_RECOVERY') { resolved = true; unsub(); showRecoveryForm(); }
      });
      // The sync hint already found type=recovery with no error= param, so PASSWORD_RECOVERY
      // normally fires almost immediately (Supabase's own internal same-tick dispatch) — but
      // supabase-js serializes auth-state work across tabs via a cross-tab lock, so a visitor with
      // another PACT tab open (or just a slow network loading the vendored client) can see it fire
      // late, not never. Do NOT unsubscribe on timeout: show the "expired" fallback as a courtesy
      // (so a genuinely dead link doesn't leave the user staring at "verifying…" forever), but keep
      // the listener alive — a late PASSWORD_RECOVERY still overrides it with the real form rather
      // than being silently dropped by an unsub() that already ran. /code-review ultra finding on
      // PR #468: the original 5s+unsub version could permanently mislabel a valid, merely-slow link
      // as expired.
      setTimeout(() => { if (!resolved) showRecoveryExpired(); }, 8000);
    } else {
      // Already signed in (bookmark, back button, etc.) — nothing to do here either; bounce to index.html.
      (async () => { if (await currentUser()) goToIndex(); })();
    }
  </script>
</body>
</html>
