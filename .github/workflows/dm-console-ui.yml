name: DM Console UI

# DM Console had NO automated UI coverage: cloud-e2e drives js/campaign.js and js/dm.js directly and
# never opens the console, and every other gate runs signed-out on a single page load. The rules panel —
# the screen a DM configures a campaign from — could break on any change with every check still green.
#
# Deliberately cheap: no Supabase stack, no sign-in. supabase-js is vendored, so the module bridge loads
# offline and fires campaign-ready; only network calls fail, which is irrelevant to wiring and arithmetic.
# That keeps this runnable on every PR touching the console, unlike cloud-e2e's ~3-minute stack boot.

on:
  pull_request:
    paths:
      - "tools/DM-Console.html"
      - "tools/PACT-Live-Char-Sheet.html"
      - "tools/PACT-CharGen-Webtool.html"
      - "js/engine.js"
      - "js/engine-data.js"
      - "js/ap-by-level.js"
      - "js/advancement.js"
      - "js/campaign.js"
      - "js/supabase-client.js"
      - "testing/scripts/dm-console-ui-e2e.mjs"
      - "testing/scripts/live-sheet-unlock-e2e.mjs"
      - "testing/scripts/live-sheet-subclass-owned-e2e.mjs"
      - "testing/scripts/dm-console-unlock-e2e.mjs"
      - "testing/scripts/dm-ap-discount-e2e.mjs"
      - "testing/scripts/wounds-ui-e2e.mjs"
      - "testing/scripts/dm-impose-picker-e2e.mjs"
      - "testing/scripts/ledger-xss-e2e.mjs"
      - "testing/scripts/dm-console-notes-e2e.mjs"
      - "testing/package.json"
      - "testing/package-lock.json"
      - ".github/workflows/dm-console-ui.yml"
  workflow_dispatch:

concurrency:
  group: dm-console-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dm-console-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: testing/package-lock.json

      - name: Install test deps
        working-directory: testing
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('testing/package-lock.json') }}

      - name: Install Chromium
        working-directory: testing
        timeout-minutes: 5
        run: npx playwright install --with-deps chromium

      - name: DM Console UI checks
        run: node testing/scripts/dm-console-ui-e2e.mjs

      # feat/dm-unlock-drawback: the Live Sheet half of the same feature. Same cost profile as the step
      # above (no Supabase, no sign-in, seeded localStorage), so it shares this job's Chromium install
      # instead of paying for a second one.
      - name: Live Sheet — a DM-unlocked drawback can be bought off, a locked one cannot
        run: node testing/scripts/live-sheet-unlock-e2e.mjs

      - name: DM Console — the Unlock control offers the right drawbacks and sends the right event
        run: node testing/scripts/dm-console-unlock-e2e.mjs

      # feat/dm-ap-discount: the DM Console control, the Live Sheet display and CharGen's spendable, in one script.
      - name: DM AP discount — DM Console sends it, Live Sheet and CharGen count it
        run: node testing/scripts/dm-ap-discount-e2e.mjs

      # feat/permanent-wounds: players can't pick the four wound-only drawbacks in CharGen or the Live Sheet, and a DM can
      # impose all of them (grouped, defaulting to Locked + flat) from the DM Console. Same cost profile as the steps above.
      - name: Wounds — hidden from players, imposable by a DM
        run: node testing/scripts/wounds-ui-e2e.mjs

      # feat/dm-impose-picker: the impose pop-up (list + detail pane) sends the same event as the old dropdown. Same cost profile.
      - name: DM impose picker — shows a drawback's impact before it is imposed
        run: node testing/scripts/dm-impose-picker-e2e.mjs

      # feat/subclass-double-purchase-guard: the Live Sheet half. An ability held through ONE door must read as owned in BOTH of
      # the lists that can sell it (class features and subclass abilities). Same cost profile as the steps above (seeded
      # localStorage, no Supabase), so it shares this job's Chromium install.
      - name: Live Sheet — a subclass ability held through one door is owned in both pickers
        run: node testing/scripts/live-sheet-subclass-owned-e2e.mjs

      # fix/ledger-xss-escaping: player-controlled LOG values (tradition names, event/envelope `rules`, award amounts) render as
      # text in every ledger-shaped view of all three tools, incl. the Live Sheet ?viewChar= DM view. Same cost profile.
      - name: Ledger renders — a stored-XSS payload in the LOG renders as text in all three tools
        run: node testing/scripts/ledger-xss-e2e.mjs

      # feat/dm-console-character-notes: the read-only Appearance & backstory block on DM Console cards and the table-view
      # detail shows the player's own text escaped (an <img onerror> backstory renders as text). Same cost profile.
      - name: DM Console — Appearance & backstory renders player text safely
        run: node testing/scripts/dm-console-notes-e2e.mjs
