name: Engine parity gate

# Headless regression gate (REV-11): asserts js/engine.js's compute()/rebuildStateFromEvents() output
# for all 24 fixtures against testing/expected/expected-results.csv — the same assertions
# testing/tests/engine-parity.html runs in a browser, ported to Node so it can run in CI with no
# browser/install step. See testing/scripts/engine-parity-ci.mjs.
#
# This is deliberately separate from character-gen-e2e.yml (REV-11's earlier randomized UI harness):
# that one drives the real tool UI end-to-end and needs a Chromium install; this one is a pure Node
# assertion against fixed fixtures and finishes in seconds, so it gates a broader path set
# (any testing/** change, not just tool/engine-touching PRs) without slowing every PR down.

on:
  pull_request:
    paths:
      - "js/engine.js"
      - "js/engine-data.js"
      - "testing/fixtures/**"
      - "testing/expected/**"
      - "testing/scripts/engine-parity-ci.mjs"
      - "testing/scripts/gen-drawback-prices-sql.mjs"
      - "sql/migrations/**"
      - "testing/scripts/log-fuzz.mjs"
      - "testing/scripts/undo-barrier-ci.mjs"
      - "testing/scripts/dm-unlock-drawback-ci.mjs"
      - "testing/scripts/dm-ap-discount-ci.mjs"
      - "testing/scripts/imposed-drawback-grants-ci.mjs"
      - "testing/scripts/wounds-ci.mjs"
      - "testing/scripts/subclass-double-purchase-ci.mjs"
      - "testing/scripts/prof-grants-ci.mjs"
      - "testing/scripts/barred-grants-ci.mjs"
      - "testing/scripts/epic-boon-price-ci.mjs"
      - "testing/scripts/version-label-ci.mjs"
      - "testing/scripts/lineage-spell-gates-ci.mjs"
      - "testing/scripts/stored-size-ci.mjs"
      - "testing/scripts/patch-fold-aliasing-ci.mjs"
      - "testing/scripts/worn-armour-ac-ci.mjs"
      - "testing/scripts/house-rules-ledger-ci.mjs"
      - "tools/PACT-CharGen-Webtool.html"
      - "tools/PACT-Live-Char-Sheet.html"
      - "tools/DM-Console.html"
      - "index.html"
      - ".github/workflows/engine-parity.yml"
  workflow_dispatch:

concurrency:
  group: engine-parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run the headless engine-parity gate
        run: node testing/scripts/engine-parity-ci.mjs

      # fix/patch-fold-aliasing: replaying a log must never write a later purchase back into a creation patch (a locked
      # character's next save is refused when it does). Engine-only, no browser.
      - name: Replaying history never rewrites it
        run: node testing/scripts/patch-fold-aliasing-ci.mjs

      # fix/worn-armour-none: with no armour worn, AC is 10 + Dex whatever armour you are trained in. Engine-only.
      - name: No armour worn means unarmoured AC
        run: node testing/scripts/worn-armour-ac-ci.mjs

  log-fuzz:
    # Phase 2 of D-GH-2026-07-13-random-e2e-real-oracle: a pure-Node, LOG-direct fuzzer for
    # js/engine.js (testing/scripts/log-fuzz.mjs — see testing/README.md). Held out of CI in
    # PR #195 until the NaN bug it found on its first run was fixed (D-GH-2026-07-13-log-fuzz-
    # phase2); wiring it in now that the fix has landed. Deliberately a separate job (not a step
    # in `parity`) so its failure is visually distinct from a fixed-fixture regression, even
    # though it shares this workflow's fast pure-Node trigger scope.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run the LOG-direct engine fuzzer
        run: node testing/scripts/log-fuzz.mjs --iterations 3000 --events 60 --seed ${{ github.run_id }}

  undo-barrier:
    # feat/undo-barrier-shared + feat/session-seal. isUndoBarrier/undoFloor/sealedFloor are ONE rule
    # relied on by two tools and, in sealedFloor()'s case, mirrored by a database trigger — exactly the
    # shape whose three hand-written copies this project spent D-GH26/36/37/40 collapsing. The gate that
    # guards it shipped in PR #492 wired into nothing: no workflow, no README entry, so its 44 assertions
    # would never have run again. Added here rather than in a new file because it shares this workflow's
    # fast pure-Node trigger scope; a separate job so a barrier regression reads distinctly from a
    # fixed-fixture one. The tools/ paths are in scope because both consume the rule.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run the shared undo-barrier / sealed-floor gate
        run: node testing/scripts/undo-barrier-ci.mjs

  dm-unlock-drawback:
    # feat/dm-unlock-drawback. activeEvents().unlocked decides whether a DM-imposed locked drawback may be
    # bought off, and it is keyed by `seq` rather than by name so a player-taken and an imposed purchase of
    # the same name are told apart. A name-keyed or too-loose match fails silently (it releases the wrong
    # purchase, or a lock the DM never lifted), so the rules are pinned here. Wired in the same change as
    # the gate, because a previous gate (undo-barrier) shipped wired into nothing and never ran again.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run the DM unlock-drawback gate
        run: node testing/scripts/dm-unlock-drawback-ci.mjs

      - name: Run the DM AP discount gate
        run: node testing/scripts/dm-ap-discount-ci.mjs

      - name: Run the engine priceOf extraction gate
        run: node testing/scripts/engine-priceof-ci.mjs

  house-rules-ledger:
    # feat/campaign-house-rules-engine (D-GH-2026-10-13-campaign-house-rules). Campaign-wide house rules move a held
    # drawback's grant in the browser (it is derived from the CURRENT effective value) while the server ledger only
    # ever sees frozen numbers, so the DM's reprice/refund/remove events have to keep the two in step. This gate
    # fuzzes campaign histories and asserts browser AP left == an independent port of the server ledger, plus the
    # priceOf / buy-off / repriceDraft / Tasha / houseRulesImpact cases. Wired in the same change as the gate.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run the campaign house-rules ledger gate
        run: node testing/scripts/house-rules-ledger-ci.mjs --iterations 1500 --seed ${{ github.run_id }}

      # AB1: the server's printed drawback values (pact_drawback_printed) are generated from js/engine-data.js. A drawback
      # price change without re-running the generator fails here.
      - name: The server's drawback price list matches js/engine-data.js
        run: node testing/scripts/gen-drawback-prices-sql.mjs --check

  imposed-drawback-grants:
    # fix/imposed-drawbacks-grant-no-ap. compute() once credited a DM-imposed drawback's table value as income
    # although the player was paid nothing: it inflated "AP remaining", fired cap warnings at a player for
    # drawbacks they never chose, and raised the creation ceiling. The parity fixtures pin the warning lists;
    # parity records only total/warnings, so remaining / the ledger rows / the ceiling are asserted here against
    # the frozen ledger, each with a player-taken control. Wired in the same change as the gate, because a
    # previous gate (undo-barrier) shipped wired into nothing and never ran again.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run the imposed-drawback grants gate
        run: node testing/scripts/imposed-drawback-grants-ci.mjs

  wounds:
    # feat/permanent-wounds. DATA.wounds says which drawbacks are lasting injuries a DM imposes (tier, body location, and
    # which four are wound-only). Wound-only entries are hidden from players purely by being in DATA.drawbacks but NOT in
    # DATA.drawbackList — a split that is easy to break silently (a name in the wrong place either lets a player pick a
    # DM-only injury or stops a DM imposing one) — and compute() carries two rules on top (a non-imposed wound-only entry
    # is a hard block; two wounds in one place is a soft warning). Pinned here, with controls. Wired in the same change
    # as the gate, because a previous gate (undo-barrier) shipped wired into nothing and never ran again.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run the wounds data and rules gate
        run: node testing/scripts/wounds-ci.mjs

  engine-legality:
    # refactor/engine-purchase-legality. The Live Sheet's "may this purchase be made" rules (legalCheck + SOFT_WARN + EXPECTED_FOLLOWUP +
    # DUP_FIELD + buy()'s hard/soft split) moved into js/engine.js as purchaseLegality() so CharGen's after-lock purchases obey the same rule
    # (CharGen only blocked warnings starting with the stop-sign marker, which let through purchases the Live Sheet refuses). This compares
    # the engine with a frozen copy of the original over every build fixture and a wide sweep of purchases. engine-parity cannot see it: it
    # asserts compute()'s output, and this rule lives in compute()'s caller. Wired in the same change as the gate, because a previous gate
    # (undo-barrier) shipped wired into nothing and never ran again.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run the purchase-legality extraction gate
        run: node testing/scripts/engine-legality-ci.mjs

  engine-wallet:
    # refactor/engine-wallet-check. The Live Sheet's gold-and-downtime wallet, soft shortfall warning and the §16 coin-for-time trade offer (_lsWallet, _lsOfferTrade,
    # _lsWalletShort) moved into js/engine.js as walletState()/walletCheck() so CharGen's after-lock purchases can show the same warning from ONE implementation (the same
    # move was made for priceOf and purchaseLegality after copies drifted). This compares the engine with a frozen copy of the original over a large seeded sweep of
    # logs, wallets, windows and quotes. engine-parity cannot see it: it asserts compute()'s output, and this lives in compute()'s caller. Wired in the same change as the
    # gate, because a previous gate (undo-barrier) shipped wired into nothing and never ran again.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run the wallet extraction gate
        run: node testing/scripts/engine-wallet-ci.mjs

      # refactor/names-slot-helper: pins allNameableSlots()/unnamedChoices() — slot order, dialog keys, blank test, kinds filter.
      - name: Run the nameable-slots gate
        run: node testing/scripts/names-slots-ci.mjs

  version-labels:
    # Every rules/build version a player can READ must agree with DATA.version / BUILD. The tools all
    # read DATA.version live at engine-ready, so the live labels are right — but the hardcoded FALLBACK
    # literals behind those live writes have rotted twice before (the Live Sheet's footer sat 30 versions
    # behind until 2026-08-06; CharGen's Info popup showed v0.339 beside a header reading v0.356,
    # reported from real use 2026-08-19). Both times the live path was fixed and the literal left. This
    # gate is what stops a third time, and it also makes "is the label stale?" answerable in one second —
    # a task was filed on 2026-09-02 claiming it was, written from a grep without loading the tool, and
    # it was wrong.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Displayed version labels agree with DATA.version and BUILD
        run: node testing/scripts/version-label-ci.mjs

  subclass-double-purchase:
    # feat/subclass-double-purchase-guard (owner decision P3, 2026-10-05). Every subclass ability is sold through two doors
    # (b.subAbilities and a mirrored b.features entry); compute() used to dedupe within each collection only, so one ability bought
    # through both was charged twice with no warning (Anders Pipeleaf, 8 + 7 AP). engine-parity pins compute()'s output (fixtures
    # CG-053..056, EV-030..031); this pins what the TOOLS rely on: purchaseLegality() refuses the second door in both orders for all
    # 192 abilities, the shared identity helpers agree, and the guard does not over-fire. Wired in the same change as the gate,
    # because a previous gate (undo-barrier) shipped wired into nothing and never ran again.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: One subclass ability is one purchase, through either door
        run: node testing/scripts/subclass-double-purchase-ci.mjs

  prof-grants:
    # feat/primal-order-magician-warden (docs/plans/2026-10-20-primal-order-magician-warden.md). Druid Primal Order and Cleric Divine
    # Order are each split into two features: Warden / Protector (no price of their own, they switch on weapon + armour proficiency
    # flags that the existing proficiency lines charge for: 15 / 21 AP) and Magician / Thaumaturge (6 AP, a cantrip and a WIS skill
    # bonus). The old keys are retired with bar:true; the Druid one keeps a grandfathered martial + Medium grant that is never priced.
    # engine-parity pins compute()'s output for the fixtures; this pins the new grant mechanism, the "never charged twice" property and
    # that the free:true guard stops a Martially Bound or cross-class buyer paying the 1 AP floor for a feature that has no price.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Features that grant proficiencies, cantrips and skill bonuses
        run: node testing/scripts/prof-grants-ci.mjs

      - name: Barred-for-now abilities keep their price and lose their free spell picks
        run: node testing/scripts/barred-grants-ci.mjs

      - name: Each epic boon costs more than the one before
        run: node testing/scripts/epic-boon-price-ci.mjs

  lineage-spell-gates:
    # fix/lineage-spell-gates (D-GH-2026-10-11-lineage-spell-gates, v0.373). Lineage spell-likes carry the PHB 2024 character
    # level as their own Hit Dice (cantrip 1, 1st-level spell 3, 2nd-level spell 5). This pins the data against an independent
    # copy of the PHB table, the engine wording (never "L3") and warning, and that CharGen greys a spell below its gate — it
    # used to sell every one at 1 Hit Die. Needs a browser for the CharGen half.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: testing/package-lock.json

      - name: Install test deps
        working-directory: testing
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('testing/package-lock.json') }}

      - name: Install Chromium
        working-directory: testing
        timeout-minutes: 5
        run: npx playwright install --with-deps chromium

      - name: Lineage spells are gated by Hit Dice, and CharGen enforces it
        run: node testing/scripts/lineage-spell-gates-ci.mjs

      # fix/stored-size (D-GH-2026-10-11-stored-size): sizeOf() is the one size rule, and CharGen stores the real size, not its
      # hidden dropdown's parked "Small". Same browser setup as the step above, so it shares the job.
      - name: A character's stored size matches its real size
        run: node testing/scripts/stored-size-ci.mjs
