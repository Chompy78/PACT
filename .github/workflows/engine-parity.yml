name: Engine parity gate

# Headless regression gate (REV-11): asserts js/engine.js's compute()/rebuildStateFromEvents() output
# for all 24 fixtures against testing/expected/expected-results.csv — the same assertions
# testing/tests/engine-parity.html runs in a browser, ported to Node so it can run in CI with no
# browser/install step. See testing/scripts/engine-parity-ci.mjs.
#
# This is deliberately separate from character-gen-e2e.yml (REV-11's earlier randomized UI harness):
# that one drives the real tool UI end-to-end and needs a Chromium install; this one is a pure Node
# assertion against fixed fixtures and finishes in seconds, so it gates a broader path set
# (any testing/** change, not just tool/engine-touching PRs) without slowing every PR down.

on:
  pull_request:
    paths:
      - "js/engine.js"
      - "js/engine-data.js"
      - "testing/fixtures/**"
      - "testing/expected/**"
      - "testing/scripts/engine-parity-ci.mjs"
      - "testing/scripts/log-fuzz.mjs"
      - "testing/scripts/undo-barrier-ci.mjs"
      - "testing/scripts/version-label-ci.mjs"
      - "tools/PACT-CharGen-Webtool.html"
      - "tools/PACT-Live-Char-Sheet.html"
      - "tools/DM-Console.html"
      - "index.html"
      - ".github/workflows/engine-parity.yml"
  workflow_dispatch:

concurrency:
  group: engine-parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run the headless engine-parity gate
        run: node testing/scripts/engine-parity-ci.mjs

  log-fuzz:
    # Phase 2 of D-GH-2026-07-13-random-e2e-real-oracle: a pure-Node, LOG-direct fuzzer for
    # js/engine.js (testing/scripts/log-fuzz.mjs — see testing/README.md). Held out of CI in
    # PR #195 until the NaN bug it found on its first run was fixed (D-GH-2026-07-13-log-fuzz-
    # phase2); wiring it in now that the fix has landed. Deliberately a separate job (not a step
    # in `parity`) so its failure is visually distinct from a fixed-fixture regression, even
    # though it shares this workflow's fast pure-Node trigger scope.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run the LOG-direct engine fuzzer
        run: node testing/scripts/log-fuzz.mjs --iterations 3000 --events 60 --seed ${{ github.run_id }}

  undo-barrier:
    # feat/undo-barrier-shared + feat/session-seal. isUndoBarrier/undoFloor/sealedFloor are ONE rule
    # relied on by two tools and, in sealedFloor()'s case, mirrored by a database trigger — exactly the
    # shape whose three hand-written copies this project spent D-GH26/36/37/40 collapsing. The gate that
    # guards it shipped in PR #492 wired into nothing: no workflow, no README entry, so its 44 assertions
    # would never have run again. Added here rather than in a new file because it shares this workflow's
    # fast pure-Node trigger scope; a separate job so a barrier regression reads distinctly from a
    # fixed-fixture one. The tools/ paths are in scope because both consume the rule.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run the shared undo-barrier / sealed-floor gate
        run: node testing/scripts/undo-barrier-ci.mjs

  version-labels:
    # Every rules/build version a player can READ must agree with DATA.version / BUILD. The tools all
    # read DATA.version live at engine-ready, so the live labels are right — but the hardcoded FALLBACK
    # literals behind those live writes have rotted twice before (the Live Sheet's footer sat 30 versions
    # behind until 2026-08-06; CharGen's Info popup showed v0.339 beside a header reading v0.356,
    # reported from real use 2026-08-19). Both times the live path was fixed and the literal left. This
    # gate is what stops a third time, and it also makes "is the label stale?" answerable in one second —
    # a task was filed on 2026-09-02 claiming it was, written from a grep without loading the tool, and
    # it was wrong.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Displayed version labels agree with DATA.version and BUILD
        run: node testing/scripts/version-label-ci.mjs
