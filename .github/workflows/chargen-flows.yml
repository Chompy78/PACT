name: CharGen flows

# Tool-handoff identity and invite-decline recovery — both reported by the 2026-08-04 usability review,
# both invisible to every other gate. Needs no Supabase stack (supabase-js is vendored, so the module
# bridges load offline), which keeps it cheap enough to run on every PR touching these paths.

on:
  pull_request:
    paths:
      - "tools/PACT-CharGen-Webtool.html"
      - "tools/PACT-Live-Char-Sheet.html"
      - "js/character-store.js"
      - "js/sync.js"
      - "js/campaign.js"
      - "js/engine.js"
      - "js/engine-data.js"
      - "testing/scripts/chargen-flows-e2e.mjs"
      - "testing/scripts/chargen-campaign-stuck-e2e.mjs"
      - "testing/scripts/player-free-ap-e2e.mjs"
      - "testing/scripts/player-award-after-lock-e2e.mjs"
      - "testing/scripts/audit-followups-e2e.mjs"
      - "testing/scripts/chargen-roll-steps-e2e.mjs"
      - "testing/package.json"
      - "testing/package-lock.json"
      - ".github/workflows/chargen-flows.yml"
  workflow_dispatch:

concurrency:
  group: chargen-flows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chargen-flows:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: testing/package-lock.json
      - name: Install test deps
        working-directory: testing
        run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('testing/package-lock.json') }}

      - name: Install Chromium
        working-directory: testing
        timeout-minutes: 5
        run: npx playwright install --with-deps chromium
      - name: CharGen flow checks
        run: node testing/scripts/chargen-flows-e2e.mjs
      - name: CharGen campaign-character stuck states
        run: node testing/scripts/chargen-campaign-stuck-e2e.mjs
      - name: Players cannot grant themselves AP
        run: node testing/scripts/player-free-ap-e2e.mjs
      - name: No AP-adding write the server refuses on a finished campaign character
        run: node testing/scripts/player-award-after-lock-e2e.mjs
      - name: Audit-fix follow-ups (wallet race, creation AP, binding, Tasha, Randomise id)
        run: node testing/scripts/audit-followups-e2e.mjs
      - name: Roll remainder to in-play purchases, spent without a dialog
        run: node testing/scripts/chargen-roll-steps-e2e.mjs --trials 40
