name: Cloud (signed-in) e2e

# Covers the half of the app no other gate touches: anything needing a signed-in Supabase session —
# invites, redemption, campaign binding, AP grants, the DM-only invite note. On 2026-08-03 five defects
# reached production green through all five existing checks, every one of them in this gap.
#
# Runs against a THROWAWAY local stack (`supabase start`). testing/scripts/cloud-e2e.mjs refuses to run
# against anything that isn't a loopback address, so a stray env var cannot point it at live player data.
#
# The test database is built from sql/schema.sql + sql/rls-policies.sql, which were verified to reproduce
# production exactly (8 tables, every column, 25 functions) — so this tests the schema that ships rather
# than the historical path through 21 dated migrations.

on:
  pull_request:
    paths:
      - "js/auth.js"
      - "js/campaign.js"
      - "js/dm.js"
      - "js/sync.js"
      - "js/supabase-client.js"
      - "sql/**"
      - "tools/*.html"
      - "testing/scripts/cloud-e2e.mjs"
      - "supabase/config.toml"
      - ".github/workflows/cloud-e2e.yml"
  workflow_dispatch:

concurrency:
  group: cloud-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cloud-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: testing/package-lock.json

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start the local Supabase stack
        run: supabase start

      - name: Show what the stack exposes (loopback only — the harness asserts this too)
        run: supabase status

      - name: Install test tooling (dev/CI only — the app itself needs no npm install)
        working-directory: testing
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('testing/package-lock.json') }}

      - name: Install Chromium
        working-directory: testing
        timeout-minutes: 5
        run: npx playwright install --with-deps chromium

      - name: Signed-in cloud scenarios
        run: node testing/scripts/cloud-e2e.mjs

      - name: Stop the stack
        if: always()
        run: supabase stop --no-backup
