name: SQL guards

# The two Postgres harnesses. NEITHER of these ran in CI before 2026-09-02 — session-seal-test.sql had
# 43 assertions covering the whole locked-history trigger family and was executed only when somebody
# remembered to run psql by hand. That is the same "wired into nothing" gap the undo-barrier gate had, and
# it is worth more here: these are the only tests that exercise the actual security boundary, since the
# browser gates all run against a stub server.
#
#   session-seal-test.sql   loads the MIGRATIONS   — what a database that has been upgraded looks like
#   rls-baseline-test.sql   loads schema.sql + rls-policies.sql — the documented FRESH-INSTALL path,
#                           and it also asserts those two sources define the SAME logic
#
# Running both is the anti-drift guard: on 2026-09-02 the baseline was three migrations behind, so a fresh
# install had no seal functions at all and re-running rls-policies.sql against production would have
# reverted the locked-history trigger and re-granted an EXECUTE a security migration had removed.
#
# Uses a real Postgres service container, not a stub — the whole point is to exercise plpgsql triggers,
# jsonb operators and the grant system as they actually behave.

on:
  pull_request:
    paths:
      - "sql/**"
      - "testing/sql/**"
      - "testing/scripts/creation-lock-guard-test/**"
      - "testing/scripts/house-rules-ledger-ci.mjs"
      - "js/engine.js"
      - "js/engine-data.js"
      - "js/campaign.js"
      - "testing/scripts/gen-drawback-prices-sql.mjs"
      - "testing/scripts/dm-campaign-house-rules-e2e.mjs"
      - "testing/scripts/dm-house-rules-e2e.mjs"
      - "testing/scripts/lib/house-rules-fake-server.mjs"
      - "tools/DM-Console.html"
      - "js/dm.js"
      - ".github/workflows/sql-guards.yml"
  workflow_dispatch:

concurrency:
  group: sql-guards-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sql-guards:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        # Without a health check the first psql can land before the server accepts connections, which
        # would fail as a "harness error" and read exactly like a real assertion failure.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres

    steps:
      - uses: actions/checkout@v4

      - name: Install the psql client
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client

      # Each harness gets a virgin schema. They both create roles and functions in `public`, so sharing
      # one would let the first silently satisfy the second's setup — and the second's entire purpose is
      # to prove the fresh-install path stands up ON ITS OWN.
      - name: Migration path — testing/sql/session-seal-test.sql
        run: |
          psql -v ON_ERROR_STOP=1 -c "drop schema if exists public cascade; create schema public;"
          psql -v ON_ERROR_STOP=1 -f testing/sql/session-seal-test.sql

      - name: Fresh-install path — testing/sql/rls-baseline-test.sql
        run: |
          psql -v ON_ERROR_STOP=1 -c "drop schema if exists public cascade; create schema public;"
          psql -v ON_ERROR_STOP=1 -c "drop schema if exists auth cascade;"
          psql -v ON_ERROR_STOP=1 -f testing/sql/rls-baseline-test.sql

      # feat/campaign-npcs: behaviour of DM-owned NPC rows (one-per-campaign exemption, RLS, grants, unbind).
      - name: Campaign NPCs — testing/sql/campaign-npcs-test.sql
        run: |
          psql -v ON_ERROR_STOP=1 -c "drop schema if exists public cascade; create schema public;"
          psql -v ON_ERROR_STOP=1 -c "drop schema if exists auth cascade;"
          psql -v ON_ERROR_STOP=1 -f testing/sql/campaign-npcs-test.sql

  # The server-freeze rehearsal (stage 1: D2 + E1). Runs the migration and its rollback on a throwaway Postgres in Docker against the LIVE trigger
  # definitions, with attack and legitimate cases (61): before = the attacks work, after = all pass, rollback = byte-identical definitions. The migration
  # is NOT applied to the live database by merging it; this keeps the file honest until the owner decides to apply it. See
  # docs/plans/2026-10-04-server-freeze-d2-e1.md. (Docker is preinstalled on ubuntu-latest runners; the script starts its own container.)
  freeze-rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Server freeze stage 1 — migration, attacks, legitimate cases, rollback
        run: testing/scripts/creation-lock-guard-test/run-freeze.sh
      # fix/server-player-award-after-lock: a player cannot raise a locked/sealed campaign character's award total (NOT applied to live by merging).
      - name: Player award after the lock — migration, attacks, legitimate paths, rollback
        run: testing/scripts/creation-lock-guard-test/run-award.sh
      # feat/campaign-house-rules-server: the campaign house-rules server half (NOT applied to live by merging). Every case lands as
      # predicted before the migration, all pass after, the SQL ledger agrees with house-rules-ledger-ci.mjs's port on the fuzz's
      # random histories and the drawback cap with js/campaign.js on 45 shapes, and the rollback is byte-identical.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: The server's drawback price list matches js/engine-data.js (AB1)
        run: node testing/scripts/gen-drawback-prices-sql.mjs --check
      - name: Campaign house rules — migration, refusals, legitimate paths, ledger cross-check, rollback
        run: testing/scripts/creation-lock-guard-test/run-house-rules.sh

  # feat/campaign-house-rules-dm-editor / -overrides: what DM Console's Character house rules editor and its per-character
  # override editor SEND (captured by their e2e with
  # --dump-calls) is replayed against the real migration in Docker: every call must be accepted, and the server's AP left
  # must equal the engine's for every finished character. Needs Chromium for the capture, so it is its own job.
  dm-house-rules-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: testing/package-lock.json
      - name: Install test deps
        working-directory: testing
        run: npm ci
      - name: Install Chromium
        working-directory: testing
        timeout-minutes: 5
        run: npx playwright install --with-deps chromium
      - name: DM Console house-rules calls replayed against the real RPC
        run: testing/scripts/creation-lock-guard-test/run-dm-house-rules-replay.sh
